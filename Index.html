<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <title>Echte 3D-Karte mit GPS</title>
    <!-- CesiumJS CSS laden -->
    <link href="https://cesium.com/downloads/cesiumjs/releases/1.114/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
    <!-- CesiumJS JavaScript laden -->
    <script src="https://cesium.com/downloads/cesiumjs/releases/1.114/Build/Cesium/Cesium.js"></script>
    <style>
        html, body, #cesiumContainer {
            width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden;
        }
        #gps-btn {
            position: absolute; top: 10px; left: 10px; z-index: 10;
            padding: 10px 15px; background: #fff; border: 1px solid #ccc;
            border-radius: 4px; cursor: pointer; font-family: sans-serif; font-weight: bold;
        }
    </style>
</head>
<body>

<div id="cesiumContainer"></div>
<button id="gps-btn">GPS-Standort anzeigen</button>

<script>
    // Standard-Token wird für die weltweiten 3D-Höhendaten (Cesium ion) nicht zwingend für den Basis-Globus benötigt
    // Wir initialisieren den 3D-Globus
    const viewer = new Cesium.Viewer('cesiumContainer', {
        terrainProvider: Cesium.createWorldTerrain(), // Echtes 3D-Gelände (Berge!)
        baseLayerPicker: false,
        timeline: false,
        animation: false
    });

    // Startansicht auf Österreich / Alpen legen (Längengrad, Breitengrad, Höhe)
    viewer.camera.flyTo({
        destination: Cesium.Cartesian3.fromDegrees(16.2421, 47.8132, 15000), // Wiener Neustadt aus 15km Höhe
        orientation: {
            heading: Cesium.Math.toRadians(0.0),
            pitch: Cesium.Math.toRadians(-45.0), // 3D-Schrägsicht
            roll: 0.0
        }
    });

    let userEntity = null;

    // GPS-Button Logik
    document.getElementById('gps-btn').addEventListener('click', () => {
        if (!navigator.geolocation) {
            alert("Geolocation wird von deinem Browser nicht unterstützt.");
            return;
        }

        navigator.geolocation.getCurrentPosition((position) => {
            const userLng = position.coords.longitude;
            const userLat = position.coords.latitude;

            // Kamera direkt zum GPS-Punkt in 3D fliegen lassen
            viewer.camera.flyTo({
                destination: Cesium.Cartesian3.fromDegrees(userLng, userLat, 1500), // 1.5 km über dem Nutzer
                orientation: {
                    heading: 0.0,
                    pitch: Cesium.Math.toRadians(-50.0), // Schöner 3D-Winkel
                    roll: 0.0
                }
            });

            // Markierung für den Standort setzen
            if (userEntity) {
                viewer.entities.remove(userEntity);
            }
            userEntity = viewer.entities.add({
                position: Cesium.Cartesian3.fromDegrees(userLng, userLat),
                point: {
                    pixelSize: 12,
                    color: Cesium.Color.RED,
                    outlineColor: Cesium.Color.WHITE,
                    outlineWidth: 2
                },
                label: {
                    text: "Du bist hier",
                    font: "14pt sans-serif",
                    style: Cesium.LabelStyle.FILL_AND_OUTLINE,
                    fillColor: Cesium.Color.WHITE,
                    outlineColor: Cesium.Color.BLACK,
                    outlineWidth: 2,
                    pixelOffset: new Cesium.Cartesian2(0, -25)
                }
            });

        }, (error) => {
            alert("Fehler bei der GPS-Standortabfrage: " + error.message);
        }, {
            enableHighAccuracy: true
        });
    });
</script>

</body>
</html>
